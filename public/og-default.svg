<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#F7F2E8"/>
      <stop offset="0.55" stop-color="#F3EDE1"/>
      <stop offset="1" stop-color="#E9E0CE"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.045"/>

  <!-- 远山三重淡墨 -->
  <g opacity="0.85">
    <path d="M0 470 L180 372 L300 436 L430 350 L560 452 L700 390 L860 470 Z" fill="#C9CEd4" opacity="0.5"/>
    <path d="M120 520 L300 424 L460 500 L620 414 L800 512 L980 452 L1200 540 L1200 630 L0 630 Z" fill="#A9B2BB" opacity="0.55"/>
    <path d="M240 572 L470 494 L680 566 L900 502 L1200 590 L1200 630 L0 630 Z" fill="#7E8A94" opacity="0.5"/>
  </g>

  <!-- 孤舟渔翁 -->
  <g transform="translate(884 522)" opacity="0.75">
    <path d="M-46 10 Q0 24 46 10 Q20 20 0 20 Q-20 20 -46 10 Z" fill="#3A3F45"/>
    <line x1="0" y1="8" x2="0" y2="-22" stroke="#3A3F45" stroke-width="2.4"/>
    <path d="M2 -20 L24 -8 L2 -2 Z" fill="#3A3F45"/>
    <ellipse cx="-14" cy="2" rx="6" ry="4.6" fill="#3A3F45"/>
  </g>

  <!-- 栏线 -->
  <line x1="88" y1="150" x2="1112" y2="150" stroke="#D4C9B6" stroke-width="2"/>
  <line x1="88" y1="158" x2="1112" y2="158" stroke="#D4C9B6" stroke-width="1" opacity="0.5"/>

  <text x="600" y="300" text-anchor="middle" font-size="126"
        font-family="LXGW WenKai, KaiTi, STKaiti, Songti SC, serif" fill="#2C2416" letter-spacing="26">倚声</text>
  <text x="600" y="382" text-anchor="middle" font-size="34"
        font-family="Songti SC, SimSun, serif" fill="#6B5E4A" letter-spacing="14">AI 填 词 工 坊</text>
  <text x="600" y="452" text-anchor="middle" font-size="24"
        font-family="Songti SC, SimSun, serif" fill="#9A8C74" letter-spacing="4">输入一段意境 · 选一个词牌 · 得一首合律的词</text>

  <!-- 朱砂印 -->
  <g transform="translate(1046 508)">
    <rect width="76" height="76" rx="9" fill="#C43D3D"/>
    <text x="38" y="34" text-anchor="middle" font-size="30" fill="#FBF4EA"
          font-family="KaiTi, STKaiti, serif">倚</text>
    <text x="38" y="66" text-anchor="middle" font-size="30" fill="#FBF4EA"
          font-family="KaiTi, STKaiti, serif">声</text>
  </g>
</svg>
