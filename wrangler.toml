# 倚声 · AI填词工坊 —— Cloudflare Pages 部署配置
# ─────────────────────────────────────────────────────────────
# 这个文件是**绑定关系**的唯一配置源：D1 / KV / R2 都写在这里，
# 而不是在控制台里点。理由：控制台里的绑定是"看不见的历史"，
# 换个人接手就不知道线上到底连了哪个库。
#
# 注意：密钥（SITE_SECRET / AI_API_KEY）不要写进本文件，
#       用 `wrangler pages secret put` 上传，或写进 .dev.vars（已被 .gitignore 排除）。

name = "yisheng"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# node:sqlite 是本地替身用的；线上用的是真 D1。
# AI 接口按需打开下行的 nodejs_compat（部分 SDK 需要）。
compatibility_flags = ["nodejs_compat"]

# ── D1：文章、评论、收藏、设置、填词记录 ────────────────────
[[d1_databases]]
binding = "DB"
database_name = "yisheng-db"
database_id = "e1a99cbb-995f-4974-9b7f-30e9df095953"

# ── KV：会话（24h）、限流计数、列表缓存 ─────────────────────
[[kv_namespaces]]
binding = "CACHE_KV"
id = "d7ece9d0d0b342c596191f888c59ac93"

# ── R2：后台封面图与正文插图 ────────────────────────────────
# 暂时不上 R2 也可以：把这一段留空/删掉，图片会以 base64 存在 D1 的 media 表里。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yisheng-media"

# ── 普通变量（非密钥）────────────────────────────────────────
# 这些可以被 wrangler 直接管理；密钥必须走 secret。
#
# AI 是**上游链**：2026-11-08 起支持多家并存、按序降级（shared/api-handler.js 的 AI_PROVIDERS）。
#   商汤日日新  SENSENOVA_API_KEY   → https://token.sensenova.cn/v1          sensenova-6.8-flash-lite
#   InferX      INFERX_API_KEY      → https://model.inferx.net/endpoints/v1  deepseek-v4.1-flash-1017-basic
#   魔搭        AI_API_KEY          → https://api-inference.modelscope.cn/v1 Qwen/Qwen3.8-Flash-Next
# 密钥只走 secret（或仪表盘 Variables），**不要写进本文件**。
# 没配 Key 的那家会被自动跳过 —— 所以这里只放「非密钥」的策略项。
#
# ⚠️ AI_DISABLE_THINKING 必须是 "1"：这几家的主力模型多是推理模型，
#    不关思考的话 max_tokens 会被思考段整段吃掉，正文一个字都吐不出来。
[vars]
AI_CHAIN = "sensenova,inferx,modelscope"
AI_BASE_URL = "https://api-inference.modelscope.cn/v1"
AI_MODEL = "Qwen/Qwen3.8-Flash-Next"
AI_DISABLE_THINKING = "1"
# 单家单次尝试的上限（还会按「还剩几家」均分，取更小的那个）
AI_TIMEOUT_MS = "9000"
# 整条链的总预算。CF Pages 单请求上限 30s，所以硬顶在 28s，别往上调。
AI_TOTAL_BUDGET_MS = "27000"

# 站点规范域名（非密钥，属正常配置）。
# 作用：/sitemap.xml 与 /robots.txt 里只写这一个域名，不管请求是从哪个域名进来的。
# 本站现在三个域名同时可访问（ystianci.de5.net / ystianci.kdns.fr /
# yishengtianci.pages.dev），若按请求域名生成，搜索引擎会拿到三套地址。
# ⚠️ 与 src/utils/seo.js 的 SITE_ORIGIN 保持一致，换主域名时两处一起改。
SITE_ORIGIN = "https://ystianci.de5.net"
